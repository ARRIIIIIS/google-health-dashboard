# project.yml —— 用 XcodeGen 生成 .xcodeproj（brew install xcodegen && xcodegen generate）
name: HealthWidget
options:
  bundleIdPrefix: com.arrhealth.healthwidget
  organizationName: ARRIIIIIS
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
packages: {}
targets:
  HealthWidget:
    type: application
    platform: macOS
    sources:
      - path: HealthWidget
    infoFile: HealthWidget/Info.plist
    # 关键：必须把 widget extension 嵌入宿主 App（.app/Contents/PlugIns/），
    # 系统才会登记这个桌面小组件。只写 dependencies 不会嵌入，桌面搜不到。
    embed:
      - HealthWidgetExtension
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: HealthWidget/HealthWidget.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.arrhealth.healthwidget
        CODE_SIGN_STYLE: Automatic

  HealthWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: HealthWidgetExtension
    infoFile: HealthWidgetExtension/Info.plist
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: HealthWidgetExtension/HealthWidgetExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.arrhealth.healthwidget.extension
        CODE_SIGN_STYLE: Automatic
