<head data-page-node-id="0QvNH3DSHbnjQ80p8vVem3">

<title>Health Dashboard · DMG 安装画面预览</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    background:#131315;color:#EDEDED;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:44px 24px 72px;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 页面外壳 ── */
  .head{text-align:center;margin-bottom:22px}
  .head h1{font-size:14px;font-weight:600;letter-spacing:.01em}
  .head p{font-size:12px;color:#6E6E73;margin-top:6px}
  .tabs{display:flex;gap:4px;padding:4px;background:#232326;border-radius:10px;margin:22px 0 26px}
  .tabs button{
    appearance:none;border:0;background:transparent;color:#9A9AA0;
    font-family:inherit;font-size:12px;font-weight:600;
    padding:7px 18px;border-radius:7px;cursor:pointer;
    transition:background .16s,color .16s;
  }
  .tabs button:hover{color:#D6D6DA}
  .tabs button.on{background:#3A3A3D;color:#fff}

  /* ── 方案变量 ── */
  .stage{--fg:#fff;--fg2:#A1A1A6;--fg3:#5A5A5F;--bar:#2C2C2E;--barfg:#8E8E93;--line:rgba(255,255,255,.30)}

  /* ══ 方案 A · 极简夜 ══ */
  .stage[data-v="a"]{--bg:linear-gradient(180deg,#212124 0%,#161618 100%);--fg:#fff;--fg2:#A1A1A6;--fg3:#5A5A5F;--line:rgba(255,255,255,.30)}
  .stage[data-v="a"] .glow-c{opacity:1;background:radial-gradient(560px 320px at 50% 44%,rgba(255,255,255,.055),transparent 72%)}
  .stage[data-v="a"] .glow-l{opacity:0}
  .stage[data-v="a"] .glow-r{opacity:0}

  /* ══ 方案 B · 环动线 ══ */
  .stage[data-v="b"]{--bg:linear-gradient(180deg,#1B1B1E 0%,#0F0F11 100%);--fg:#fff;--fg2:#A1A1A6;--fg3:#5A5A5F;--line:transparent}
  .stage[data-v="b"] .glow-c{opacity:1;background:radial-gradient(600px 360px at 50% 46%,rgba(255,255,255,.06),transparent 70%)}
  .stage[data-v="b"] .glow-l{opacity:1}
  .stage[data-v="b"] .glow-r{opacity:1}
  .stage[data-v="b"] .rings{opacity:1}

  /* ══ 方案 C · 浅色系统 ══ */
  .stage[data-v="c"]{--bg:linear-gradient(180deg,#FFFFFF 0%,#F2F2F7 100%);--fg:#1C1C1E;--fg2:#8E8E93;--fg3:#C7C7CC;--line:rgba(0,0,0,.22);--bar:#EBEBED;--barfg:#7A7A7E}
  .stage[data-v="c"] .glow-c{opacity:1;background:radial-gradient(560px 320px at 50% 44%,rgba(0,0,0,.022),transparent 72%)}
  .stage[data-v="c"] .glow-l{opacity:0}
  .stage[data-v="c"] .glow-r{opacity:0}
  .stage[data-v="c"] .win{box-shadow:0 22px 56px -14px rgba(0,0,0,.42),0 0 0 .5px rgba(0,0,0,.18)}
  .stage[data-v="c"] .win-body{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}

  /* ── Finder 窗口 ── */
  .win{
    width:660px;border-radius:11px;overflow:hidden;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.72),0 0 0 .5px rgba(255,255,255,.09);
    transform:translateZ(0);
  }
  .win-bar{height:36px;display:flex;align-items:center;padding:0 14px;background:var(--bar);position:relative}
  .dots{display:flex;gap:8px}
  .dot{width:12px;height:12px;border-radius:50%}
  .d1{background:#FF5F57}.d2{background:#FEBC2E}.d3{background:#28C840}
  .win-title{
    position:absolute;left:0;right:0;text-align:center;
    font-size:13px;font-weight:600;color:var(--barfg);pointer-events:none;
  }

  .win-body{position:relative;width:660px;height:420px;overflow:hidden;background:var(--bg);color:var(--fg)}
  .layer{position:absolute;inset:0}

  /* 光晕 */
  .glow{position:absolute;inset:0;transition:opacity .3s}
  .glow-l{background:radial-gradient(340px 260px at 6% 96%,rgba(255,45,85,.085),transparent 70%)}
  .glow-r{background:radial-gradient(340px 260px at 94% 96%,rgba(10,132,255,.085),transparent 70%)}

  /* 三色同心弧（方案 B）—— 呼应 App 图标的活动环 */
  .rings{position:absolute;inset:0;opacity:0;transition:opacity .3s}
  .stage[data-v="b"] .rings{opacity:1}

  /* 品牌区 */
  .brand{position:absolute;left:0;right:0;top:44px;text-align:center}
  .brand-t{font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--fg)}
  .brand-s{font-size:12px;color:var(--fg2);margin-top:7px}

  /* 引导箭头 */
  .guide{position:absolute;left:50%;top:208px;transform:translate(-50%,-50%);width:96px;height:12px}
  .guide svg{position:absolute;inset:0;width:96px;height:12px}
  .guide .g-a,.guide .g-b{display:none}
  .stage[data-v="a"] .guide .g-a{display:block}
  .stage[data-v="b"] .guide .g-b{display:block}
  .stage[data-v="c"] .guide .g-a{display:block}

  /* Finder 图标 + 名称 */
  .item{position:absolute;top:144px;width:128px;text-align:center}
  .item img{width:128px;height:128px;display:block;-webkit-user-drag:none}
  .item span{display:block;margin-top:9px;font-size:12px;color:var(--fg);white-space:nowrap;text-align:center}
  .item-app{left:101px}
  .item-dst{left:431px}

  /* 底部提示 */
  .foot{position:absolute;left:0;right:0;bottom:34px;text-align:center}
  .foot-m{font-size:13px;color:var(--fg2)}
  .foot-s{font-size:9px;color:var(--fg3);margin-top:9px;letter-spacing:.02em}

  /* 页面说明 */
  .meta{margin-top:26px;font-size:12px;color:#6E6E73;text-align:center;line-height:1.75;max-width:660px}
  .meta b{color:#A1A1A6;font-weight:600}
</style>
</head>

  var NOTES = {

  var stage = document.getElementById('stage');
  var meta = document.getElementById('meta');
  function setV(v){
    stage.setAttribute('data-v', v);
    meta.innerHTML = NOTES[v];
    document.querySelectorAll('#tabs button').forEach(function(b){
      b.classList.toggle('on', b.dataset.v === v);
    });
    if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
  }
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(b) setV(b.dataset.v);
  });
  window.addEventListener('hashchange', function(){
    var v = location.hash.slice(1);
    if (NOTES[v]) setV(v);
  });
  setV(NOTES[location.hash.slice(1)] ? location.hash.slice(1) : 'a');
</script>
