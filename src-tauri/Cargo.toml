[package]
name = "health-dashboard-tauri"
version = "1.0.0"
description = "跨平台健康仪表盘小组件 (Tauri + Google Health)"
edition = "2021"
rust-version = "1.77"

# objc 0.2 老 crate 内部使用 #[cfg(feature = "cargo-clippy")]，需声明该 feature 避免 unexpected_cfgs 警告
[features]
cargo-clippy = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
libc = "0.2"

# macOS 桌面层级窗口（贴桌面、不挡普通窗口）需要直接调 NSWindow；
# window-vibrancy 提供系统原生 NSVisualEffectView 磨砂玻璃（HudWindow 材质，边缘干净无折射光晕）；
# tauri-plugin-liquid-glass 已弃用：NSGlassEffectView 边缘折射光晕在桌面小组件上不可控
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
window-vibrancy = "0.6"
# 提供 NSRect 等 Foundation/AppKit 类型，给手写 NSVisualEffectView 用
cocoa = "0.26"

# Windows：Acrylic 磨砂窗口 + 注册表开机自启
[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
winreg = "0.52"

[profile.release]
opt-level = 2
